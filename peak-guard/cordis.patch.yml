# dsh-peak-guard: pause before DeepSeek API peak pricing, save work, allow an override.
- insert:
    - id: peak-guard
      name: '@local/dsh-peak-guard'
      config:
        enabled: true
        leadMinutes: 3
        peakWindows:
          - '09:00-12:00'
          - '14:00-18:00'
        workdays: [1, 2, 3, 4, 5]
        utcOffsetMinutes: 480
        handoffFile: PEAK_HANDOFF.md
